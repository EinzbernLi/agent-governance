schema_version: "1.0"

ordinary_governance:
  version: "0.3.27"
  change_class: governance_consistency_hardening
  authority_model: accepted_main_plus_VERSION
  compatibility_contract_path: GOVERNANCE_RELEASE.yaml

update_discovery:
  adopter_choice_required: true
  supported_modes:
    - github_native_notify
    - manual_pinned
  recommended_mode: github_native_notify
  normal_takeover_requires_upstream_probe: false
  automatic_adoption_allowed: false
  automatic_pin_advance_allowed: false
  auto_follow_main_allowed: false
  detector_template_path: templates/GOVERNANCE_UPDATE_CHECK.yml
  detector_reads_governance_lock: true
  signal_type: downstream_github_issue
  signal_marker: "[GOVERNANCE-UPDATE-SIGNAL]"
  public_source_requires_extra_credentials: false
  private_source_optional_downstream_secret: GOVERNANCE_SOURCE_TOKEN

adoption:
  ai_first_default: true
  manual_installer_required: false
  first_adoption_informed_confirmation_required: true
  core_is_disableable_feature_bundle: false
  ordinary_optional_choices:
    - governance_update_discovery
    - adopter_local_model_bindings
    - project_local_model_calibration
    - anonymized_upstream_model_feedback_permission
    - lprl
  choices_persist_only_in_existing_downstream_surfaces: true
  second_adoption_state_store_allowed: false
  console_is_ordinary_onboarding_choice: false
  accepted_pin_remains_authority_until_explicit_change: true
  compatibility_review_required_before_pin_change: true
  explicit_downstream_pin_update_required: true
  prior_pin_inflight_task_behavior: governed_by_the_projects_current_accepted_pin_and_local_policy

project_policy_layering:
  project_local_policy_remains_local: true
  local_policy_may_add_or_tighten_constraints: true
  local_policy_may_weaken_central_invariants: false
  task_may_satisfy_explicit_local_authorization_gates: true
  task_may_silently_override_local_policy: false

adopter_local_model_bindings:
  policy_path: templates/LOCAL_POLICY.yaml:model_bindings
  placement_owner: config/DISPATCH_POLICY.yaml
  model_routing_owner: config/MODEL_ROUTING.yaml
  central_catalog_path: config/MODEL_REGISTRY.yaml
  supported_surfaces: [web, agent]
  selection_happens_after_surface_resolution: true
  surface_pool_is_placement_authority: false
  central_registry_is_exhaustive_adopter_allowlist: false
  custom_model_requires_explicit_surface_pool_membership: true
  configured_nonempty_pool_bounds_final_selection: true
  central_model_requires_duplicated_status_or_evidence: false
  local_custom_model_gains_central_status_or_cross_project_evidence: false
  default_model_and_role_preferences_are_exact_pins: false
  exact_task_or_owner_model_override_may_pin_one_task: true
  one_model_pool_requires_special_routing_mode: false
  ai_recommendation_allowed: true
  initial_or_material_persisted_change_requires_owner_confirmation: true
  conversation_display_is_surface_or_model_authority: false
  formal_launch_requires_explicit_surface_and_local_policy: true

takeover_resume:
  takeover_only_effect: activate_reconcile_recommend_wait
  post_reconciliation_state: AWAIT_OWNER_CONTINUE
  resume_target_is_execution_authorization: false
  later_explicit_owner_turn_required: true
  takeover_phrase_continue_satisfies_later_turn: false
  separate_explicit_bounded_initial_instruction_is_takeover_only: false
  owner_continue_requires_current_fact_and_scope_reread: true

execution_economy:
  policy_path: config/DISPATCH_POLICY.yaml
  supported_profiles:
    - lead_direct_preferred
    - native_delegate_preferred
    - balanced
  fallback_profile: balanced
  project_local_override_path: templates/LOCAL_POLICY.yaml
  project_local_override_field: execution_economy.profile
  runtime_hints_are_capability_proof: false
  runtime_hints_are_model_qualification_proof: false
  capability_probe_outranks_profile_hint: true
  runtime_mode_is_capability_defined_not_client_brand_defined: true
  profile_names_are_compatibility_identifiers_not_brand_requirements: true
  web_mode_requires_confirmed_github_repository_read_write: true
  github_native_operations_are_not_agent_placement_triggers: true
  remote_repository_ci_is_not_local_test_execution: true
  external_owner_launch_is_provider_and_client_neutral: true
  required_execution_surface_precedes_model_selection: true
  task_safety_model_local_runtime_and_independence_constraints_outrank_profile: true
  owner_relay_for_quota_only_when_direct_compliant: false
  precise_token_accounting_required: false
  usage_telemetry_required: false
  default_runtime_hints:
    web_interactive: lead_direct_preferred
    codex_native_subagents: native_delegate_preferred
    unknown_or_other: balanced
  runtime_profiles_path: config/DISPATCH_POLICY.yaml:runtime_profiles
  runtime_profiles_mode: delta_only
  runtime_profiles_are_capability_proof: false
  runtime_profiles_are_model_qualification_proof: false
  runtime_override_boundary_path: config/CONFORMANCE_POLICY.yaml:runtime_override_boundary
  runtime_placement_policy_path: config/DISPATCH_POLICY.yaml:runtime_placement_policy
  web_external_assignment_placement_path: config/DISPATCH_POLICY.yaml:web_external_assignment_placement
  local_materialization_default_surface: codex
  remote_only_default_surface: web
  placement_is_authority: false
  external_transport_reclassifies_originating_runtime_profile: false
  native_agent_cross_software_external_route_uses_web_external_placement: false
  material_dispatch_decision:
    required_fields: [profile, native_dispatch_available, work_suitable_for_native_delegate, selected_route, bypass_reason]
    capability_suitability_route_are_separate: true
    native_preferred_direct_bypass_requires_bounded_reason: true
    quota_saving_alone_is_not_a_valid_bypass_reason: true

delegation_controls:
  nested_delegation_default_allowed: false
  codex_worker_native_delegation_default_allowed: true
  web_worker_native_delegation_default_allowed: false
  codex_child_use_optional: true
  codex_quota_preservation_is_valid_material_benefit: true
  cheaper_child_qualification_bypass_allowed: false
  parallel_child_write_overlap_allowed: false
  child_review_counts_as_independent_validation: false
  child_recursive_delegation_default: false
  parent_remains_accountable: true
  canonical_lifecycle: [ROUTE_RESOLVED, TASK_PACKAGE_FROZEN, DISPATCHED, CHILD_RUNNING, PARENT_WAITING, COMPLETED, BLOCKED, NEEDS_ATTENTION, ABORTED, RESULT_READ, LEAD_INTEGRATION, VALIDATION_ACCEPTANCE]
  default_wait_mode: event_or_blocking_or_long_event
  while_child_running_no_substantive_progress_inspection: true
  fallback_without_event_wait: bounded_low_frequency_terminal_status_only
  fallback_status_must_not_fetch_substantive_output: true
  terminal_result_read_required_before_lead_integration: true
  validator_material_midflight_substantive_intervention_contaminates: true
  fresh_independent_validation_required_when_contaminated: true

conformance:
  policy_path: config/CONFORMANCE_POLICY.yaml
  protocol_path: docs/conformance/GOVERNANCE_CONFORMANCE_PROTOCOL.md
  input_template_path: templates/GOVERNANCE_CONFORMANCE_INPUT.yaml
  result_template_path: templates/GOVERNANCE_CONFORMANCE_RESULT.yaml
  checker_path: templates/GOVERNANCE_CONFORMANCE_CHECK.py
  evaluation_modes: [central_governance, downstream_project]
  overall_statuses: [CONFORMANT, RECONCILIATION_REQUIRED, BLOCKED]
  local_action_decisions: [ALLOW, BLOCK]
  derived_read_only_evidence: true
  becomes_authority_store: false
  network_required: false
  automatic_pin_advance_allowed: false
  local_action_execution_allowed: false
  bounded_drift_triggers_only: true
  console_consumption_optional_read_only: true
  policy_schema: "0.2"
  evaluator_version: "0.3.17"
  semantic_authority_map_is_derived_verification_metadata: true
  shared_kernel_is_canonical_owner_references_only: true
  runtime_profiles_delta_only: true
  unknown_owner_override_trigger_or_precedence_fails_closed: true
  durable_authority_precedence_is_semantic_role_plus_exact_revision: true
  formal_presentation_owner: docs/task-package/TASK_PACKAGE_SPEC.md
  simplicity_metrics_required: true
  runtime_placement_contract_checked: true
  web_external_placement_contract_checked: true
  codex_worker_delegation_contract_checked: true
  running_task_revision_binding_checked: true
  informed_adoption_required_markers_checked: true
  stateless_upstream_required_markers_checked: true
  private_evidence_hub_required_markers_checked: true

project_local_calibration:
  evidence_source: same_project_durable_task_result_validation_acceptance_facts
  normalized_outcome_marker: "[PROJECT-CALIBRATION-OUTCOME-v1]"
  outcome_template_path: templates/PROJECT_CALIBRATION_OUTCOME.json
  extractor_template_path: templates/PROJECT_CALIBRATION_EXTRACTOR.py
  workflow_template_path: templates/PROJECT_CALIBRATION_UPDATE.yml
  downstream_extractor_path: .agent/tools/project-calibration.py
  downstream_workflow_path: .github/workflows/project-calibration.yml
  state_transport: downstream_github_issue
  state_title: "[PROJECT-LOCAL-CALIBRATION] Derived model routing prior"
  state_marker: "[PROJECT-LOCAL-CALIBRATION-STATE-v1]"
  state_issue_cardinality_required: exactly_one
  state_is_derived_cache_only: true
  state_is_task_result_acceptance_authority: false
  deleting_state_deletes_authoritative_evidence: false
  rebuildable_from_durable_facts: true
  automatic_outcome_extraction: true
  first_adoption_owner_choice_required: true
  recommended_enabled: true
  automatic_enable_without_owner_confirmation: false
  explicit_project_disable_allowed: true
  project_policy_constraints_outrank_recommendation: true
  model_attribution_dimensions:
    - role
    - task_class
    - risk_level
    - model_semantic_key
    - reasoning_semantic_key
  worker_validator_aggregates_separate: true
  single_global_model_score_allowed: false
  recent_comparable_evidence_weighted_more: true
  semantic_revision_creates_new_key: true
  material_internal_delegation_direct_model_attribution_allowed: false
  dispatch_route_is_covariate_not_model_identity: true
  runtime_profile_is_covariate_not_model_identity: true
  incomplete_or_malformed_scan_usable_for_routing: false
  missing_or_unusable_state_blocks_task_authority: false
  missing_or_unusable_state_fallback: governance_calibration_snapshot
  required_latency_or_cost_telemetry: false
  upstream_export_default: false
  upstream_export_aggregate_only: true
  automatic_upstream_delivery_allowed: false
  central_telemetry_required: false
  adopter_registration_required: false
  stable_adopter_pseudonym_required: false
  anonymous_feedback_counts_as_distinct_project_source: false

private_evidence_hub:
  status: optional_private_fork_capability
  product_module: false
  protocol_path: docs/model-governance/PRIVATE_EVIDENCE_HUB.md
  input_template_path: templates/PRIVATE_EVIDENCE_HUB_INPUT.json
  aggregator_template_path: templates/PRIVATE_EVIDENCE_HUB_AGGREGATOR.py
  config_transport: same_private_governance_repository_issue
  config_title: "[PRIVATE-EVIDENCE-HUB] Sources"
  config_marker: "[PRIVATE-EVIDENCE-HUB-CONFIG-v1]"
  state_transport: same_private_governance_repository_issue
  state_title: "[PRIVATE-CROSS-PROJECT-CALIBRATION] Derived routing prior"
  state_marker: "[PRIVATE-CROSS-PROJECT-CALIBRATION-STATE-v1]"
  source_evidence: project_local_derived_calibration_state
  minimum_distinct_sources_per_usable_group: 2
  project_local_calibration_has_higher_routing_precedence: true
  governance_calibration_snapshot_has_lower_routing_precedence: true
  state_is_derived_cache_only: true
  state_is_task_result_acceptance_authority: false
  automatic_model_qualification_allowed: false
  automatic_core_rule_rewrite_allowed: false
  automatic_public_upstream_delivery_allowed: false
  v1_refresh_mode: agent_or_manual_deterministic
  v1_cross_repository_workflow_or_token_automation: false
  second_repository_required: false
  database_daemon_or_hosted_service_required: false

external_model_evidence:
  source_count: 1
  source: LiveBench/new-livebench
  source_config_path: config/EXTERNAL_MODEL_EVIDENCE_SOURCE.yaml
  accepted_evidence_path: config/EXTERNAL_MODEL_EVIDENCE.yaml
  protocol_path: docs/model-governance/EXTERNAL_MODEL_EVIDENCE.md
  updater_path: templates/EXTERNAL_MODEL_EVIDENCE_UPDATE.py
  workflow_path: .github/workflows/external-model-evidence.yml
  accepted_metric_granularity: source_native_task_score
  representative_groups: 7
  model_keys: 4
  observation_count: 28
  evidence_is_task_result_acceptance_authority: false
  project_and_governance_calibration_have_higher_precedence: true
  exact_accepted_ref_required_when_materially_used: true
  later_revision_retroactive_task_change_allowed: false
  automatic_model_qualification_allowed: false
  automatic_production_route_promotion_allowed: false
  automatic_merge_allowed: false
  required_private_external_credential: false

modules:
  lprl:
    independent_pin: true
    root_path: modules/local-resource-lifecycle
    version_path: modules/local-resource-lifecycle/VERSION
    version: "0.2.5-pilot"
    semantic_change: false
    semantic_change_scope: none_in_ordinary_governance_0_3_27
    semantic_change_digest_contract: unchanged_lprl_cjson_v1_projections
    ordinary_governance_upgrade_does_not_silently_repin_module: true
    first_adoption_default_enabled: false
    first_adoption_preview_warning_required_when_selected: true

privacy:
  stateless_upstream_required: true
  downstream_project_registry_present: false
  downstream_project_specific_facts_allowed: false
  downstream_fact_ingest_required: false
  downstream_raw_model_outcome_ingest_allowed: false
  adopter_registration_required: false
  usage_telemetry_required: false
  phone_home_required: false
  automatic_upstream_feedback_delivery_allowed: false
  stable_adopter_pseudonym_required_or_created: false
  optional_private_source_secret_remains_downstream_local: true

notes:
  - "Ordinary governance 0.3.27 is a consistency hardening release: it aligns adoption, execution-surface-before-model ordering, Web direct-first / native delegate-first behavior, provider-neutral external launch, and GitHub-native remote execution semantics without adding an authority surface."
  - "Formal Worker/Validator launch validation now requires the already-resolved execution surface plus the project LOCAL_POLICY, so a configured surface model pool cannot be bypassed merely by omitting LOCAL_POLICY from the validation call; the renderer still does not choose placement or models."
  - "EXECUTOR_COMPLIANCE is narrowed to special exact-model/reasoning compliance and no longer duplicates ordinary Task, dispatch, nested-delegation, lifecycle or validator-independence policy."
  - "Ordinary governance 0.3.26 adds optional downstream-local Web/Agent model pools and soft defaults/role preferences in the existing LOCAL_POLICY; Dispatch remains the only execution-surface owner and model selection happens only after surface resolution."
  - "The central MODEL_REGISTRY remains a recommended/validated catalog rather than an exhaustive adopter allowlist. Explicitly declared local custom models gain downstream eligibility only, with no central status, cross-project evidence, or automatic promotion."
  - "The Startup Card renderer remains an offline validation/render gate: it validates explicit surface-pool membership but never infers surface from conversation text, never ranks models, and leaves the visible three-field/three-line card unchanged."
  - "Model-pool defaults and role preferences are ranking hints only; one-model pools need no special route and only an explicit exact Task/Owner override may hard-pin one Task model. Initial or materially changed persisted bindings require Owner confirmation."
  - "Ordinary governance 0.3.25 requires one compact derived model-routing decision before standard Worker/independent-Validator Startup Card emission; missing or invalid evidence blocks launch without adding a new authority store."
  - "The launch gate consumes existing MODEL_REGISTRY/MODEL_ROUTING boundaries, explicitly accounts for a registered candidate challenger, and leaves the user-facing three-field/three-line Startup Card unchanged; it does not rank candidates, run calibration, or auto-qualify models."
  - "Ordinary governance 0.3.24 makes runtime profiles capability-defined rather than client-brand-defined while retaining the existing profile names as compatibility identifiers."
  - "The new external placement preference is Web/non-native-only and runs only after external dispatch is already required: local-environment tasks prefer an external local-capable Agent, remote-only tasks prefer an external Web conversation, and session freshness remains governed separately."
  - "Native-agent/Codex-style Leads remain native-delegate-first. If they escalate to an external Agent for cross-software capability, the originating native profile is retained; external transport does not invoke the Web-only placement rule or bounce execution back to Web."
  - "Ordinary governance 0.3.23 adds an optional Issue-native Private Evidence Hub for user-owned private governance forks. It aggregates usable project-local calibration into a derived cross-project routing prior below project-local evidence and above governance/global priors, without becoming a third product module or authority store."
  - "PEH v1 is deliberately offline/agent-driven: no second evidence repository, database, daemon, hosted service, cross-repository workflow/token automation, automatic public-upstream delivery, model auto-qualification or Core auto-rewrite is introduced."
  - "Ordinary governance 0.3.22 changes first adoption presentation only enough to make real optional behavior explicit: update discovery, project-local calibration, anonymized aggregate feedback permission, and optional LPRL. It adds no wizard state, module manager, second authority store or Console onboarding choice."
  - "0.3.22 formalizes a stateless-upstream privacy boundary: downstream identity/state/raw model evidence stays downstream-local; upstream feedback is explicit opt-in aggregate-only and never automatically delivered. Anonymous packages do not prove distinct project sources."
  - "All anti-drift semantics remain unchanged: exact accepted pin, discovery != adoption, no auto-follow-main/pin advance, exact running Task revision binding, takeover reconciliation, conformance, Lead Acceptance and independent LPRL pin/no silent repin."
  - "Ordinary governance 0.3.20 adds deterministic evidence-deficit challenger exploration and Gemini 3.8 as a fresh candidate identity; candidate status remains shadow/qualification/evidence-acquisition only and Gemini 3.7 remains separate."
  - "Ordinary governance 0.3.19 makes Lead core responsibilities runtime-independent under config/DISPATCH_POLICY.yaml and adds the offline deterministic templates/STARTUP_CARD_RENDER.py presentation helper; neither adds authority nor changes LPRL semantics."
  - "Ordinary governance 0.3.18 adds one accepted GitHub-native LiveBench evidence prior below project-local and governance calibration; it does not qualify models or become Task/Result/Acceptance authority."
  - "The v1 prior uses four static compatible-prior model mappings and one fixed source-native task score from each of seven LiveBench groups, for 28 observations; no category average, overall score or cross-site composite is created."
  - "Monthly/manual refresh is fail-closed and PR-only: an existing update PR is never mutated, failed refresh leaves accepted evidence untouched, and there is no automatic merge, qualification or production-route promotion."
  - "Ordinary governance 0.3.17 pins each running executor to the exact activated Task revision until explicit route-appropriate re-anchor evidence changes the binding."
  - "A later same-Issue Task revision may be read as durable fact but publication or observation alone does not update the running contract; material authority conflict without re-anchor fails closed before further material work."
  - "Result evidence records the exact executed Task ref and any from/to/evidence re-anchor chain; internal children remain within the parent exact activated revision and Lead interpretation uses the recorded executed ref."
  - "Ordinary governance 0.3.16 consolidates material semantics behind one machine-checked canonical owner map, delta-only runtime profiles, deterministic cold-path triggers and generic exact-revision authority precedence."
  - "README, Dispatch Routing and Subagent Reliability are navigation/reference surfaces rather than parallel normative owners; the ordinary static hot path is reduced to Dispatch Policy, Result template and Lead Acceptance."
  - "Formal startup cards use exactly 模型, 思考等级 and 对话; standard Worker/Validator launchers use one activation-pointer text block with three semantic lines."
  - "Local materialization defaults to the Codex/native-agent compatibility surface and remote-only work prefers Web; profile selection remains capability-defined, not brand-defined, and higher-precedence role, qualification, independence, safety and proven capability still win."
  - "A Codex/native-agent Worker may use qualified native children by default for material quota/context/time/specialization benefit while retaining scope, write, integration and terminal Result accountability; child review is not independent validation."
  - "A takeover-only Owner message activates/reconciles the Lead and produces an advisory RESUME_TARGET, then waits in AWAIT_OWNER_CONTINUE; its embedded continue wording does not authorize execution."
  - "Governance update discovery remains independent from project-local model calibration; neither mechanism adopts governance or changes model qualification by itself."
  - "Execution Economy remains a runtime route-preference layer; dispatch/runtime observations are calibration covariates and are never model identity."
  - "Terminal Lead Acceptance may carry a machine-readable calibration outcome derived from durable facts; this is factual normalization, not a human subjective model rating."
  - "The downstream calibration Issue is a rebuildable routing-prior cache only. Task, Result, Validation and Lead Acceptance remain the evidence authority."
  - "Worker and Validator evidence is aggregated separately by role/task-class/risk/model-semantic-key/reasoning-semantic-key; this release defines no single global model score."
  - "Material model or reasoning semantic revisions form new calibration keys; older keys remain separate weak priors rather than direct current evidence."
  - "The current LPRL module root and version path remain modules/local-resource-lifecycle and modules/local-resource-lifecycle/VERSION; LPRL semantic version remains 0.2.5-pilot."
  - "This manifest is compatibility metadata, not a second governance authority store."
