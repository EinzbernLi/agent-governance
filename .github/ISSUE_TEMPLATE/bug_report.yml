name: Bug report
description: Report a reproducible, public-safe problem
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, secrets, private repository data, or private downstream facts.
  - type: dropdown
    id: module
    attributes:
      label: Affected module or surface
      options:
        - Core Governance
        - LPRL
        - Shared tooling/docs surface
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or pin (if known)
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal public-safe reproducible evidence
      description: Remove secrets, private URLs, machine-local paths, and downstream-sensitive facts.
    validations:
      required: true
  - type: textarea
    id: conformance
    attributes:
      label: Conformance or CI status (if relevant)
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-safe acknowledgment
      options:
        - label: I confirm that this report contains no secrets or private downstream facts.
          required: true
