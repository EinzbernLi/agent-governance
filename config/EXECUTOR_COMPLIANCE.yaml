schema_version: "1.1"
last_updated: "2026-09-06"
scope: special_exact_model_reasoning_compliance_only

# Ordinary Task, dispatch/delegation, and independent-validation semantics are
# intentionally NOT duplicated here. Their canonical owners remain the existing
# Task Package, Dispatch Policy, and Lead Acceptance surfaces.
canonical_ordinary_owners:
  task_scope_permissions_evidence_tests_result: docs/task-package/TASK_PACKAGE_SPEC.md
  dispatch_capability_route_delegation_lifecycle: config/DISPATCH_POLICY.yaml
  independent_validation_and_final_acceptance: docs/acceptance/LEAD_CONTROLLER_ACCEPTANCE_PROTOCOL.md

ordinary_task_boundary:
  ordinary_task_semantics_are_owned_elsewhere: true
  duplicated_ordinary_task_gate_allowed: false
  duplicated_nested_delegation_policy_allowed: false
  duplicated_dispatch_decision_policy_allowed: false
  duplicated_validator_independence_policy_allowed: false
  hidden_internal_model_metadata_is_not_an_ordinary_gate: true

special_model_identity_mode:
  explicit_task_only: true
  protocol: docs/protocol/EXECUTOR_REASONING_COMPLIANCE.md
  enabled_for: [model_qualification, model_benchmark, exact_runtime_identity_experiment]

invariants:
  - "exact_model_reasoning_compliance_is_special_mode_only"
  - "ordinary_task_semantics_are_owned_elsewhere"
  - "ordinary_dispatch_does_not_require_hidden_model_attestation"
  - "special_identity_checks_do_not_expand_task_scope_or_authority"
