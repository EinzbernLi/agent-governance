# A Deployment Manifest represents an observed runtime Deployment subject.
# deployment_definition_refs may be empty or unresolved; a Source/config
# definition must never be promoted into a runtime Deployment merely to fill
# this template.
#
# DEPLOYMENT_ROLLBACK_GATE_PASS blocks retirement of required current deployment
# targets, requires required previous rollback capacity to be preserved/replaced,
# and rejects UNKNOWN/BLOCKED binding or rollback compatibility.
